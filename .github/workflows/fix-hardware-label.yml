name: Normalize Hardware label casing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-hardware-label.yml"

permissions:
  issues: write
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner;
            const repo=context.repo.repo;
            try {
              await github.rest.issues.updateLabel({
                owner,repo,name:"hardware",new_name:"Hardware",
                description:"Sensores, actuadores, cableado y alimentación"
              });
            } catch(e) {
              if(e.status!==404) throw e;
            }
