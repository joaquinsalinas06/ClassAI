name: Normalize ClassAI planning metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/normalize-planning-metadata.yml"

permissions:
  issues: write
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const apiVersion = "2026-03-10";

            // 1) Rename useful labels: no namespace prefixes in the UI.
            const renames = {
              "area:hardware":     ["Hardware", "Sensores, actuadores, cableado y alimentación"],
              "area:firmware":     ["Firmware", "Firmware y lógica embebida del ESP32"],
              "area:connectivity": ["Connectivity", "Wi-Fi, MQTT, broker y comunicaciones"],
              "area:backend":      ["Backend", "Backend, ingestión, APIs y persistencia"],
              "area:platform":     ["Platform", "Dashboard y experiencia web"],
              "area:data-ai":      ["Data & AI", "Datos, analítica y asistente de IA"],
              "area:nfc":          ["NFC", "PN532, tarjetas NFC, Android HCE y APDU"],
              "area:mobile":       ["Mobile", "Aplicación Android/Kotlin"],
              "mode:in-class":     ["In class", "Trabajo que requiere o aprovecha acceso físico en clase"],
              "mode:parallel":     ["Parallel", "Trabajo que puede avanzar independientemente fuera de clase"],
              "mode:testing":      ["Testing", "Validación, pruebas y regresión"],
              "mode:integration":  ["Integration", "Conecta varias capas o componentes del sistema"]
            };

            for (const [oldName, [newName, description]] of Object.entries(renames)) {
              try {
                await github.rest.issues.updateLabel({
                  owner, repo,
                  name: oldName,
                  new_name: newName,
                  description
                });
                core.info(`Renamed ${oldName} -> ${newName}`);
              } catch (e) {
                if (e.status === 404) {
                  core.info(`Label ${oldName} not found; already renamed or absent`);
                } else if (e.status === 422) {
                  core.info(`Destination label ${newName} already exists; keeping existing label`);
                } else {
                  throw e;
                }
              }
            }

            // 2) Remove metadata labels that now belong to native GitHub structures / Project fields.
            const obsoleteLabels = [
              "type:roadmap","type:milestone","type:epic","type:task",
              "priority:P0","priority:P1","priority:P2",
              "week:S9","week:S10","week:S11","week:S12"
            ];
            for (const name of obsoleteLabels) {
              try {
                await github.rest.issues.deleteLabel({owner, repo, name});
                core.info(`Deleted obsolete label ${name}`);
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

            // 3) Clean issue titles. Milestone, category, assignee and area belong in metadata.
            const customTitles = {
              1:  "Validar entradas base — martes 06/10",
              6:  "Completar sensores y actuadores — miércoles 07/10",
              11: "Contrato de datos, MQTT y plataforma simulada",
              17: "Integrar subsistemas de entrada — martes 13/10",
              22: "Conectar ESP32, confort y actuación — miércoles 14/10",
              27: "Backend, persistencia, dashboard y app móvil",
              33: "Integrar ClassAI end-to-end — martes 20/10",
              38: "Primera sesión ClassAI completa — miércoles 21/10",
              43: "Completar producto, historial, deploy y asistente",
              49: "Regresión, corrección y freeze v1.0 — miércoles 28/10",
              50: "Triar y resolver defectos críticos de la prueba real",
              55: "Cierre técnico, documentación y handoff",
              60: "Validación real en aula — martes 27/10",
              65: "Histórico — Semana 9 · 05/10 → 11/10",
              66: "Histórico — Semana 10 · 12/10 → 18/10",
              67: "Histórico — Semana 11 · 19/10 → 25/10",
              68: "Histórico — Semana 12 · 26/10 → 01/11",
              69: "Plan de implementación de ClassAI — Semanas 9–12",
              72: "Validar ESP32 + PN532 ↔ Android HCE end-to-end"
            };

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "all", per_page: 100
            });

            for (const issue of issues) {
              if (issue.pull_request) continue;
              let title = customTitles[issue.number];
              if (!title) {
                title = issue.title
                  .replace(/^(\[[^\]]+\])+\s*/g, "")
                  .replace(/^[🧰🧪⚡]\s*/u, "")
                  .replace(/^Paralelo\s+—\s+/i, "")
                  .trim();
              }

              let body = issue.body || "";
              // Native sub-issues render the hierarchy; remove duplicated checklist section.
              body = body.replace(/\n## Subissues\n[\s\S]*?(?=\n## |$)/g, "");

              if (title !== issue.title || body !== (issue.body || "")) {
                await github.rest.issues.update({
                  owner, repo,
                  issue_number: issue.number,
                  title,
                  body
                });
              }
            }

            // 4) Expand native blocked-by relations into a deliberate critical path.
            const deps = {
              14: [12,13],
              15: [12],
              19: [4,5,7,8],
              20: [12,19],
              23: [13,14],
              24: [12,19,20,23],
              25: [8,19],
              26: [9,10,25],
              28: [12,13,14],
              21: [12,18,70,73],
              29: [12,21,73],
              30: [21,28,29,73],
              31: [15,28,30],
              32: [31],
              36: [18,19,20,23,24,25,26],
              35: [25,26,36],
              34: [18,21,23,28,30,73,74],
              37: [21,24,28,30,34],
              44: [30,32,34],
              45: [29,30],
              46: [28,31,44,45],
              47: [29,30,45],
              48: [28,30,34,36],
              39: [34,35,36,37,44,45,74,75],
              40: [23,35,36],
              41: [19,25,36,44],
              42: [21,30,37,45],
              75: [30,34,73,74],
              76: [72,74,75],
              61: [34,37,40,75,76],
              62: [35,36,40],
              63: [19,25,35,41],
              64: [30,42,44,45,46],
              50: [61,62,63,64],
              51: [50],
              52: [48,51],
              53: [44,51,75],
              54: [50,51,52],
              56: [36,37,54,70,75],
              57: [39,40,41,42,51,61,62,63,64,75,76],
              58: [46,54,74,76],
              59: [54,56,57]
            };

            const freshIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "all", per_page: 100
            });
            const byNumber = new Map(
              freshIssues.filter(x => !x.pull_request).map(x => [x.number, x])
            );

            for (const [issueNumStr, blockerNums] of Object.entries(deps)) {
              const issueNum = Number(issueNumStr);
              for (const blockerNum of blockerNums) {
                const blocker = byNumber.get(blockerNum);
                if (!blocker) continue;
                try {
                  await github.request("POST /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by", {
                    owner, repo,
                    issue_number: issueNum,
                    issue_id: blocker.id,
                    headers: {
                      "X-GitHub-Api-Version": apiVersion,
                      "Accept": "application/vnd.github+json"
                    }
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;
                }
                await new Promise(resolve => setTimeout(resolve, 120));
              }
            }
