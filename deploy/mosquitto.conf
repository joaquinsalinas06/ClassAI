per_listener_settings true
listener 8883
allow_anonymous false
password_file /mosquitto/config/private/passwd
acl_file /mosquitto/config/acl
cafile /mosquitto/config/private/ca.crt
certfile /mosquitto/config/private/server.crt
keyfile /mosquitto/config/private/server.key
require_certificate false
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
connection_messages false
