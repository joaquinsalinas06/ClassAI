<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0f13" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ClassAI</title>
    <script>
      try { const t = localStorage.getItem("classai.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
