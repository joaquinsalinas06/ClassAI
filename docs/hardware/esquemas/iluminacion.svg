<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 364" class="block w-full min-w-[680px]" role="img" aria-label="Esquema M-11: Iluminación · material pendiente" data-mission-diagram="iluminacion"><title>M-11 · Iluminación · material pendiente · esquema de referencia, sin ensayo físico</title><rect width="1000" height="364" rx="12" fill="#edf3f6"></rect><g font-family="Arial, sans-serif" fill="#25384c"><text x="32" y="38" font-size="23" font-weight="700">M-11 · Iluminación · material pendiente</text><text x="32" y="64" font-size="13">Mapa eléctrico por nombres · posiciones ordenadas por función, no por ubicación física</text><g><g transform="translate(38 92)"><rect width="64" height="64" rx="5" fill="#285e85" stroke="#163149"></rect><g><rect x="-4" y="8" width="6" height="5" fill="#cbb16d"></rect><rect x="62" y="8" width="6" height="5" fill="#cbb16d"></rect></g><g><rect x="-4" y="18" width="6" height="5" fill="#cbb16d"></rect><rect x="62" y="18" width="6" height="5" fill="#cbb16d"></rect></g><g><rect x="-4" y="28" width="6" height="5" fill="#cbb16d"></rect><rect x="62" y="28" width="6" height="5" fill="#cbb16d"></rect></g><g><rect x="-4" y="38" width="6" height="5" fill="#cbb16d"></rect><rect x="62" y="38" width="6" height="5" fill="#cbb16d"></rect></g><g><rect x="-4" y="48" width="6" height="5" fill="#cbb16d"></rect><rect x="62" y="48" width="6" height="5" fill="#cbb16d"></rect></g><g><rect x="5" y="7" width="24" height="43" fill="#49a8dc"></rect><circle cx="46" cy="32" r="16" fill="#e3edf3"></circle></g></g><text x="118" y="118" font-size="17" font-weight="700">Sensor de luz</text><text x="118" y="142" font-size="12" fill="#546d82">No recibido</text></g><text x="40" y="194" font-size="12" fill="#526c81">Conexiones por terminal · cada fila representa una red o tramo; no un cable H–H obligatorio</text><g data-mission-wire="0" opacity="1" aria-label="Conexión 1: Sensor por recibir a ESP32 · interfaz por definir"><rect x="20" y="212" width="960" height="56" rx="7" fill="#fff" stroke="#d4dfe7"></rect><text x="34" y="239" font-size="12" fill="#637f94">1</text><text x="62" y="239" font-size="14" font-weight="600">Sensor por recibir</text><rect x="365" y="226" width="9" height="12" rx="2" fill="#c5aa65" stroke="#816f42"></rect><path d="M374 232 H636" stroke="#147b60" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6" fill="none"></path><rect x="636" y="226" width="9" height="12" rx="2" fill="#c5aa65" stroke="#816f42"></rect><text x="658" y="239" font-size="14" font-weight="600">ESP32 · interfaz por definir</text><g><rect x="380" y="213" width="248" height="17" rx="4" fill="#edf3f6"></rect><text x="504" y="225" text-anchor="middle" font-size="11" fill="#344f63">No conectar</text></g><text x="62" y="259" font-size="11" fill="#9b6418">Condicionado: resolver antes de energizar</text></g><text x="32" y="340" font-size="12" fill="#526c81">Continuo: conexión propuesta · discontinuo: pendiente · comprobar kit, pinout y alimentación antes del ensayo</text></g></svg>
